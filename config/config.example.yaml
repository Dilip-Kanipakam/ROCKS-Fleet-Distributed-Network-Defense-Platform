project:
  name: ROCKS Fleet
  version: 0.1.0

deployment:
  mode: all-in-one

edge:
  enabled: true
  sensor_id: ROCKS-EDGE-01
  interface: ""
  capture_mode: live
  hub_url: ""
  send_interval_seconds: 5
  buffer_limit: 10000

hub:
  enabled: false
  host: 127.0.0.1
  port: 8000
  url: ""
  api_key: ""
  timeout_seconds: 10
  edge_liveness_timeout_seconds: 60

telemetry:
  interval_seconds: 60
  window_seconds: 60

health:
  telemetry_freshness_seconds: 300

storage:
  database: ""
  buffer: ""
  hub_database: ""

ml:
  enabled: false
  model_path: data/ml/rocks_baseline.joblib
  minimum_samples: 20
  model_version: rocks-baseline-v1

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8000
  session_secret: ""
  admin_username: ""
  admin_password_hash: ""

alerts:
  enabled: true
  anomaly_threshold: 0.70
  high_retention_threshold: 0.70

email:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  username: ""
  password: ""
  from: ""
  to: ""
  minimum_severity: HIGH
  starttls: true
  use_ssl: false
  timeout_seconds: 5
