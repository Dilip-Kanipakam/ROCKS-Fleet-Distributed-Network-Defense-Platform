<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ROCKS Command Center Login</title><link rel="stylesheet" href="/dashboard/static/dashboard.css"></head>
<body class="login"><main class="login-panel"><p class="eyebrow">ROCKS FLEET</p><h1>Command Center</h1><p>Administrator access</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}{% if not configured %}<div class="error">Dashboard credentials are not configured.</div>{% endif %}<form method="post" action="/dashboard/login"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></main></body></html>
